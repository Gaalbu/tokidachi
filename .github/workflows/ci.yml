name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: make test
      - run: mvn --batch-mode package
      - name: Smoke-test shaded JAR
        run: |
          jar_path=$(find target -maxdepth 1 -type f -name 'tokidachi-*-all.jar' -print -quit)
          test -n "$jar_path"
          java -jar "$jar_path" --pretty
        env:
          HOME: ${{ runner.temp }}/empty-home
          XDG_CACHE_HOME: ${{ runner.temp }}/cache

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: mvn --batch-mode -Pnative package
      - run: target/tokidachi --pretty
        env:
          HOME: ${{ runner.temp }}/empty-home
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
      - run: ./scripts/package.sh target/tokidachi
      - run: test -f dist/tokidachi-linux-x86_64.tar.gz && test -f dist/tokidachi@gaalbu.github.io.shell-extension.zip

  native-portability:
    name: Native image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build native collector
        run: mvn --batch-mode -Pnative package
      - name: Smoke-test native collector
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then target/tokidachi.exe --pretty > output.json; else target/tokidachi --pretty > output.json; fi
          test -s output.json
          python -c "import json; d=json.load(open('output.json')); assert d['version'] == 1; assert isinstance(d['providers'], dict)"
        env:
          HOME: ${{ runner.temp }}/empty-home
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/empty-claude
          CODEX_HOME: ${{ runner.temp }}/empty-codex

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The extension declares support for GNOME 45 to 48, but the machine that
  # develops it only has one of them. Each container carries the real Clutter,
  # Meta and St introspection data for its GNOME release, so the API surface
  # the extension depends on is checked against every version it claims.
  #
  # Fedora 39 and 40 are out of support. Their repositories still serve these
  # packages today; if that changes the job fails loudly rather than silently
  # skipping, and the fix is either an archive mirror or dropping that GNOME
  # version from metadata.json.
  gnome-api-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - gnome: '45'
            image: 'fedora:39'
          - gnome: '46'
            image: 'fedora:40'
          - gnome: '47'
            image: 'fedora:41'
          - gnome: '48'
            image: 'fedora:42'
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GNOME introspection data
        run: dnf install -y gjs mutter gnome-shell
      - name: Report versions
        run: rpm -q --qf 'mutter %{VERSION}\ngnome-shell %{VERSION}\n' mutter gnome-shell
      - name: Check the API surface for GNOME ${{ matrix.gnome }}
        run: ./scripts/gjs-test.sh --require

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: make test
      - run: mvn --batch-mode package
      - name: Smoke-test shaded JAR
        run: |
          jar_path=$(find target -maxdepth 1 -type f -name 'tokidachi-*-all.jar' -print -quit)
          test -n "$jar_path"
          java -jar "$jar_path" --pretty
        env:
          HOME: ${{ runner.temp }}/empty-home
          XDG_CACHE_HOME: ${{ runner.temp }}/cache

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: mvn --batch-mode -Pnative package
      - run: target/tokidachi --pretty
        env:
          HOME: ${{ runner.temp }}/empty-home
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
      - run: ./scripts/package.sh target/tokidachi
      - run: test -f dist/tokidachi-linux-x86_64.tar.gz && test -f dist/tokidachi@gaalbu.github.io.shell-extension.zip

  native-portability:
    name: Native image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build native collector
        run: mvn --batch-mode -Pnative package
      - name: Smoke-test native collector
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then target/tokidachi.exe --pretty > output.json; else target/tokidachi --pretty > output.json; fi
          test -s output.json
          python -c "import json; d=json.load(open('output.json')); assert d['version'] == 1; assert isinstance(d['providers'], dict)"
        env:
          HOME: ${{ runner.temp }}/empty-home
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/empty-claude
          CODEX_HOME: ${{ runner.temp }}/empty-codex
